<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Mehul Jagwani — Fintech Marketer &amp; Trader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-deep: #060B18;
    --navy-base: #0B142B;
    --navy-surface: #101F42;
    --navy-card: rgba(14, 25, 54, 0.78);
    --border-glass: rgba(56, 189, 248, 0.18);
    --cyan-accent: #00E5FF;
    --blue-neon: #38BDF8;
    --indigo-glow: #6366F1;
    --emerald-up: #10B981;
    --text-primary: #F8FAFC;
    --text-muted: #94A3B8;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html, body{ height:100%; }

  body{
    min-height: 100dvh;
    background-color: var(--navy-deep);
    background-image:
      radial-gradient(at 0% 0%, rgba(0, 229, 255, 0.14) 0px, transparent 50%),
      radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.22) 0px, transparent 55%),
      linear-gradient(175deg, #060B18 0%, #0B1736 50%, #060B18 100%);
    color: var(--text-primary);
    font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 32px 16px;
    -webkit-font-smoothing: antialiased;
    position: relative;
    overflow-x: hidden;
  }

  /* Grid overlay for technical fintech aesthetic */
  body::before{
    content:"";
    position:fixed; inset:0;
    background-image: 
      linear-gradient(to right, rgba(56, 189, 248, 0.04) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(56, 189, 248, 0.04) 1px, transparent 1px);
    background-size: 32px 32px;
    pointer-events:none;
  }

  @media (prefers-reduced-motion: no-preference){
    .card{ animation: floatIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) both; }
    .mark-icon{ animation: pulseGlow 0.6s ease both 0.1s; }
    .field, .cta{ animation: fadeUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) both; }
    .field:nth-of-type(1){ animation-delay: 0.28s; }
    .field:nth-of-type(2){ animation-delay: 0.38s; }
    .cta{ animation-delay: 0.48s; }
  }
  @keyframes floatIn{ from{opacity:0; transform:translateY(22px) scale(0.98);} to{opacity:1; transform:translateY(0) scale(1);} }
  @keyframes fadeUp{ from{opacity:0; transform:translateY(12px);} to{opacity:1; transform:translateY(0);} }
  @keyframes pulseGlow{ from{transform:scale(0.85); opacity:0;} to{transform:scale(1); opacity:1;} }

  .card{
    width:100%;
    max-width: 392px;
    background: var(--navy-card);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 28px;
    overflow:hidden;
    box-shadow:
      0 24px 60px -15px rgba(2, 6, 23, 0.85),
      0 0 0 1px var(--border-glass),
      0 0 45px -12px rgba(0, 229, 255, 0.12) inset;
    position:relative;
  }

  /* Ticker gradient line */
  .band{
    height: 4px;
    background: linear-gradient(90deg, #00E5FF 0%, #38BDF8 35%, #6366F1 70%, #10B981 100%);
    box-shadow: 0 2px 14px rgba(0, 229, 255, 0.6);
  }

  .inner{ padding: 38px 28px 28px; text-align:center; }

  /* Candlestick & Market Trend Badge */
  .mark-icon{
    width: 68px;
    height: 68px;
    margin: 0 auto 20px;
    border-radius: 20px;
    background: linear-gradient(145deg, #10214D 0%, #081129 100%);
    border: 1px solid rgba(0, 229, 255, 0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 
      0 12px 28px -6px rgba(0, 229, 255, 0.25),
      0 0 16px -2px rgba(99, 102, 241, 0.3) inset;
  }
  .mark-icon svg{
    width: 34px;
    height: 34px;
    stroke: var(--cyan-accent);
  }

  .name{
    font-size: 27px;
    font-weight: 800;
    line-height: 1.15;
    letter-spacing: -0.02em;
    color: #FFFFFF;
    text-shadow: 0 2px 12px rgba(255, 255, 255, 0.1);
  }

  /* Status badge styled like a live trading market ticker */
  .ticker-chip{
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 14px;
    padding: 6px 14px;
    border-radius: 999px;
    background: rgba(16, 185, 129, 0.1);
    border: 1px solid rgba(16, 185, 129, 0.28);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    color: #6EE7B7;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .status-dot{
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--emerald-up);
    box-shadow: 0 0 8px var(--emerald-up);
  }

  .tagline{
    margin-top: 10px;
    font-size: 13.5px;
    font-weight: 600;
    line-height: 1.45;
    color: #93C5FD;
    letter-spacing: -0.01em;
  }

  .divider{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin: 22px auto;
  }
  .divider-line{
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(56, 189, 248, 0.25), transparent);
  }
  .divider-node{
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--cyan-accent);
    box-shadow: 0 0 8px var(--cyan-accent);
  }

  .fields{ display:flex; flex-direction:column; gap:11px; text-align:left; }

  .field{
    display:flex; align-items:center; gap:14px;
    padding: 13px 16px;
    background: rgba(16, 31, 66, 0.65);
    border-radius: 16px;
    text-decoration:none;
    color: var(--text-primary);
    border: 1px solid rgba(56, 189, 248, 0.12);
    box-shadow: 0 4px 14px rgba(2, 6, 23, 0.35);
    transition: transform .18s ease, border-color .18s ease, background .18s ease;
  }
  .field:hover{
    background: rgba(16, 35, 78, 0.9);
    border-color: rgba(0, 229, 255, 0.45);
    transform: translateY(-1px);
  }
  .field:active{ transform: scale(0.985); }
  .field:focus-visible{ outline: 2px solid var(--cyan-accent); outline-offset: 2px; }

  .icon{
    flex:none; width:40px; height:40px; border-radius:12px;
    background: linear-gradient(135deg, rgba(0, 229, 255, 0.15) 0%, rgba(99, 102, 241, 0.25) 100%);
    border: 1px solid rgba(0, 229, 255, 0.25);
    display:flex; align-items:center; justify-content:center;
  }
  .icon svg{ width:18px; height:18px; stroke: var(--cyan-accent); }

  .field-text{ display:flex; flex-direction:column; gap:2px; min-width:0; }
  .field-label{
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--blue-neon);
  }
  .field-value{
    font-size: 14.5px;
    font-weight: 600;
    color: #F1F5F9;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .cta{
    appearance: none;
    -webkit-appearance: none;
    border: none;
    cursor: pointer;
    margin-top: 18px;
    display:flex; align-items:center; justify-content:center; gap:10px;
    width:100%;
    padding: 15px 18px;
    border-radius: 16px;
    background: linear-gradient(135deg, #00C6FF 0%, #0072FF 60%, #4F46E5 100%);
    color: #FFFFFF;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 700;
    font-size: 14.5px;
    letter-spacing: 0.01em;
    text-decoration:none;
    box-shadow:
      0 12px 28px -8px rgba(0, 114, 255, 0.6),
      0 1px 0 rgba(255, 255, 255, 0.3) inset;
    transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
  }
  .cta:hover{
    filter: brightness(1.08);
    box-shadow: 0 14px 32px -6px rgba(0, 198, 255, 0.65);
  }
  .cta:active{ transform: scale(0.98); }
  .cta:focus-visible{ outline: 2px solid var(--cyan-accent); outline-offset:2px; }
  .cta svg{ width:18px; height:18px; stroke: #FFFFFF; flex:none; }

  .footer{
    margin-top: 24px; padding-top:14px;
    border-top: 1px solid rgba(56, 189, 248, 0.12);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-muted);
    font-weight: 500;
  }
</style>
</head>
<body>

  <main class="card">
    <div class="band" aria-hidden="true"></div>
    <div class="inner">

      <!-- Fintech Trading & Signal Icon -->
      <div class="mark-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <!-- Candlestick bar 1 -->
          <line x1="6" y1="4" x2="6" y2="8"></line>
          <rect x="4.5" y="8" width="3" height="7" rx="0.5" fill="rgba(0,229,255,0.2)"></rect>
          <line x1="6" y1="15" x2="6" y2="20"></line>
          <!-- Trend vector -->
          <polyline points="10 16 14 11 18 13 22 7"></polyline>
          <polyline points="18 7 22 7 22 11"></polyline>
        </svg>
      </div>

      <h1 class="name">Mehul Jagwani</h1>

      <div class="ticker-chip">
        <span class="status-dot"></span>
        <span>Fintech &bull; Markets</span>
      </div>

      <p class="tagline">Fintech Marketer &amp; Part-time Trader</p>

      <div class="divider" aria-hidden="true">
        <span class="divider-line"></span>
        <span class="divider-node"></span>
        <span class="divider-line"></span>
      </div>

      <div class="fields">
        <a class="field" href="tel:+918866465048">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.362 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.338 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>
            </svg>
          </span>
          <span class="field-text">
            <span class="field-label">Phone</span>
            <span class="field-value">+91 88664 65048</span>
          </span>
        </a>

        <a class="field" href="mailto:mehul.digitalm@gmail.com">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
              <path d="m22 6-10 7L2 6"/>
            </svg>
          </span>
          <span class="field-text">
            <span class="field-label">Email</span>
            <span class="field-value">mehul.digitalm@gmail.com</span>
          </span>
        </a>
      </div>

      <button type="button" class="cta" id="saveContactBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
          <path d="M19 8v6M22 11h-6"/>
        </svg>
        Save Contact
      </button>

      <p class="footer">FINTECH &bull; QUANT &bull; GROWTH MARKETING</p>
    </div>
  </main>

  <script>
    document.getElementById('saveContactBtn').addEventListener('click', function () {
      var vcard = 'BEGIN:VCARD\r\n' +
        'VERSION:3.0\r\n' +
        'N:Jagwani;Mehul;;;\r\n' +
        'FN:Mehul Jagwani\r\n' +
        'TITLE:Fintech Marketer & Part-time Trader\r\n' +
        'TEL;TYPE=CELL:+918866465048\r\n' +
        'EMAIL:mehul.digitalm@gmail.com\r\n' +
        'END:VCARD\r\n';

      var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

      if (isIOS) {
        window.location.href = 'data:text/vcard;charset=utf-8,' + encodeURIComponent(vcard);
      } else {
        var blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'Mehul_Jagwani.vcf';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      }
    });
  </script>
</body>
</html>
